services:
  postgres:
    image: postgres:15
    container_name: aimm-postgres
    environment:
      POSTGRES_DB: aimm-fullstack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
    env_file:
      - ./apps/agent/.env
    volumes:
      - ./apps/agent:/app
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data: