services:
  postgres:
    image: postgres:15
    container_name: aimm-postgres
    env_file:
      - ./apps/indexer/.env.docker
    ports:
      - "5432:5432"
    volumes:
      # - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/init-aimm-db.sh:/docker-entrypoint-initdb.d/init-aimm-db.sh
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
  #agent:
  #  build:
  #    context: ./apps/aimm-agent
  #    dockerfile: Dockerfile
  #  ports:
  #    - "5002:5000"
  #  environment:
  #    - FLASK_ENV=development
  #  volumes:
  #    - ./apps/aimm-agent:/app
  #  restart: unless-stopped
  #  depends_on:
  #    - postgres

  indexer:
    build:
      context: .
      dockerfile: ./apps/indexer/Dockerfile
    # Internal only - Caddy handles external traffic
    expose:
      - "42069"
    environment:
      - NODE_ENV=production
    env_file:
      - ./apps/indexer/.env.docker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: aimm-caddy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - indexer
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
