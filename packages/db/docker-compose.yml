services:
  postgres:
    image: postgres:15
    container_name: aimm-postgres
    environment:
      POSTGRES_DB: aimm-fullstack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
