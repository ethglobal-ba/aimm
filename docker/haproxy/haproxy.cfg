# HAProxy configuration for AIMM
# Reverse proxy for indexer and agent services

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # SSL settings
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# HTTP frontend - redirect to HTTPS
frontend http_front
    bind *:80
    mode http

    # ACME challenge path for cert renewal
    acl is_acme path_beg /.well-known/acme-challenge/
    use_backend acme_backend if is_acme

    # Redirect all other traffic to HTTPS
    http-request redirect scheme https unless is_acme

# HTTPS frontend
frontend https_front
    bind *:443 ssl crt /etc/haproxy/aimm.lat.pem
    mode http

    # Security headers
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Compression
    compression algo gzip
    compression type text/html text/plain text/css application/json application/javascript

    # Route /agent/* to agent backend
    acl is_agent path_beg /agent

    use_backend agent_backend if is_agent
    default_backend indexer_backend

# Indexer backend (port 42069)
backend indexer_backend
    mode http
    http-request set-header X-Forwarded-Proto https
    server indexer 127.0.0.1:42069

# Agent backend (port 5002)
backend agent_backend
    mode http
    http-request set-header X-Forwarded-Proto https
    # Strip /agent prefix before forwarding to Flask
    http-request set-path %[path,regsub(^/agent,/)]
    server agent 127.0.0.1:5002

# ACME challenge backend (for HTTP-01 cert renewals)
backend acme_backend
    mode http
    server acme 127.0.0.1:8888
