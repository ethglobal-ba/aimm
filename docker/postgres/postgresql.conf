# PostgreSQL configuration for pub/sub support
# Based on PostgreSQL 15 default configuration with pub/sub enhancements

#------------------------------------------------------------------------------
# CONNECTION AND AUTHENTICATION
#------------------------------------------------------------------------------

listen_addresses = '*'
port = 5432
max_connections = 100

#------------------------------------------------------------------------------
# RESOURCE USAGE (except WAL)
#------------------------------------------------------------------------------

shared_buffers = 128MB
dynamic_shared_memory_type = posix

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------

# Enable logical replication for pub/sub functionality
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10

# WAL configuration for better performance
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

#------------------------------------------------------------------------------
# REPLICATION
#------------------------------------------------------------------------------

# Enable logical replication
max_logical_replication_workers = 4
max_sync_workers_per_subscription = 2

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

# Log configuration for debugging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'mod'
log_min_messages = info
log_line_prefix = '%t [%p-%l] %q%u@%d '

# Log replication activity
log_replication_commands = on

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------

deadlock_timeout = 1s

#------------------------------------------------------------------------------
# CUSTOMIZED OPTIONS
#------------------------------------------------------------------------------

# Additional settings for pub/sub performance
shared_preload_libraries = 'pg_stat_statements'
track_activities = on
track_counts = on